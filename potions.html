<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зелья для дракона</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Макет мини-игры «сортировка зелий»: тёмный космос, цвета берём из палитры драконов, значок на каждом цвете для дальтоников */
:root{--bg:#0b1020;--panel:#141a33;--panel2:#1b2244;--line:#2a3366;--fg:#e8ecff;--mute:#9aa4d4;--gold:#f5b942;--violet:#8b7cf6;--cell:#10162e;color-scheme:dark;
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1d2760 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--fg);font-family:var(--fb);padding-block:10px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;height:calc(100% - 10px)}
.tag{font:700 .68rem var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font:700 1.5rem/1.15 var(--fd);margin:2px 0 0;text-wrap:balance}
.sub{color:var(--mute);font-size:.88rem;line-height:1.45;margin:4px 0 0}
.heat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.heat .row{display:flex;justify-content:space-between;gap:8px;font-size:.86rem}.heat .row b{color:var(--gold)}
.pips{display:flex;gap:6px;margin-top:8px}
.pip{flex:1;height:8px;border-radius:5px;background:var(--cell);border:1px solid var(--line)}
.pip.on{background:linear-gradient(90deg,#f5b942,#ffd98a);border-color:#f5b942;box-shadow:0 0 10px #f5b94266}
.lv{display:flex;gap:8px}
.lvb{flex:1;font:700 .82rem var(--fb);padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;min-width:0}
.lvb.cur{border-color:var(--violet);color:var(--fg);background:var(--panel2)}.lvb.done{border-color:var(--gold);color:var(--gold)}
.lvb:disabled{opacity:.45;cursor:default}

canvas{display:block;touch-action:manipulation;flex:none}

.sheet.open{display:block}
.bar{gap:6px}.bar .btn{padding:12px 2px;font-size:.74rem;white-space:nowrap;gap:4px;min-width:0}.bar .btn svg{width:14px;height:14px}

/* кнопки и вкладки в стиле платформы: индиго как акцент, золото как награда, стеклянные тёмные плашки */
:root{--accent:#6366f1;--accent-hi:#8184f5;--accent-lo:#4f46e5;--gold2:#f59e0b;--glass:rgba(255,255,255,.05);--glass-line:rgba(255,255,255,.12)}
.lvb,.btn,.q{transition:background .18s,border-color .18s,transform .08s,box-shadow .18s}
.lvb{background:var(--glass);border:1px solid var(--glass-line);color:var(--text2,#cbd5e1);border-radius:10px;font-weight:700}
.lvb:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.lvb.cur{background:linear-gradient(180deg,var(--accent),var(--accent-lo));border-color:var(--accent-hi);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.lvb.done:not(.cur){border-color:var(--gold2);color:var(--gold2);background:rgba(245,158,11,.10)}
.lvb.done.cur{box-shadow:0 0 0 1px var(--gold2),0 4px 14px rgba(99,102,241,.35)}
.btn{background:var(--glass);border:1px solid var(--glass-line);color:#f8fafc;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.28)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{background:rgba(245,158,11,.15);border-color:var(--gold2);color:#fbbf24}
.btn.gold{background:linear-gradient(180deg,#fbbf24,var(--gold2));border-color:#fbbf24;color:#1a1204;box-shadow:0 4px 14px rgba(245,158,11,.3)}
.btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#000}
.q{background:var(--glass);border-color:var(--glass-line);color:#cbd5e1}.q:hover{background:rgba(255,255,255,.15);color:#fff}
.chip{background:rgba(30,41,59,.85);border-color:var(--glass-line)}

/* стиль кнопок платформы: тёмно-синий градиент с индиго-рамкой; золотая версия фиолетовая с золотой рамкой и золотым текстом */
:root{--nv1:#1f2550;--nv2:#141836;--nv-line:#5a5ec9;--vi1:#2d2062;--vi2:#1d1347;--au:#e9b949;--au-t:#f7d98a}
.lvb,.btn,.q,.chip{background:linear-gradient(135deg,var(--nv1),var(--nv2));border:1.5px solid var(--nv-line);color:#fff;border-radius:11px;box-shadow:none}
.lvb{color:#c9cdf5;opacity:1}
.lvb:hover:not(:disabled),.btn:hover:not(:disabled),.q:hover{background:linear-gradient(135deg,#2a3163,#1a1f45);border-color:#7a7ee0;color:#fff}
.lvb.cur,.btn.gold,.btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--vi1),var(--vi2));border:1.5px solid var(--au);color:var(--au-t);box-shadow:0 0 14px rgba(233,185,73,.28)}
.btn.gold:hover:not(:disabled){background:linear-gradient(135deg,#3a2a7c,#25185a);border-color:#ffd36b;color:#ffe5a3}
.lvb.done:not(.cur){border-color:var(--au);color:var(--au-t);background:linear-gradient(135deg,#2a2150,#19143a)}
.lvb.done.cur{box-shadow:0 0 14px rgba(233,185,73,.38)}
.btn:disabled{opacity:.45}
.chip{padding:6px 10px;border-radius:12px;border-width:1px}
.mode{font-weight:800}
.q{border-radius:50%;background:#2d3040;border-color:#3a3f58;color:#e1e4f2}
.lvb.cur:hover:not(:disabled){background:linear-gradient(135deg,var(--vi1),var(--vi2));border-color:var(--au);color:var(--au-t)}
.chip .row{font-size:.74rem;white-space:nowrap}.chip .row b{white-space:nowrap}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px}.mode .mt{font-size:.9rem}.mode .ms{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;opacity:.85;white-space:nowrap}
.chip{transition:opacity .2s}.chip.dim{opacity:.45}
@keyframes winin{from{opacity:0;transform:scale(.92)}}
.win b{background:linear-gradient(180deg,#fff3c4,#f5b942);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
</style>

  for(let k=Math.ceil(top)-1;k>=0;k--){
    const h=Math.min((k+1),cut)*U,yl=BOT-h-cy; // высота верха слоя в системе, повёрнутой обратно
    const col=COL[layers[k]][0],g=ctx.createLinearGradient(-(IRx-ILx)/2,0,(IRx-ILx)/2,0);g.addColorStop(0,shade(col,.35));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.22));
    ctx.fillStyle=g;ctx.beginPath();
    if(k===Math.ceil(top)-1){ctx.moveTo(-90,yl+30);ctx.lineTo(-90,yl);for(let x=-90;x<=90;x+=6)ctx.lineTo(x,yl+Math.sin(x*.09+t*.004)*amp);ctx.lineTo(90,yl+30);ctx.lineTo(90,200);ctx.lineTo(-90,200);ctx.closePath()}
    else{ctx.rect(-90,yl,180,400)}
    ctx.fill();
    if(k===Math.ceil(top)-1){ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(-90,yl-0.5,180,1.6)}
  }
  if(glyphs){ctx.fillStyle='rgba(10,14,34,.55)';ctx.font='700 15px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let k=0;k<Math.min(layers.length,Math.ceil(top));k++){const mid=(Math.min(k+1,cut)+k)/2*U;if(Math.min(k+1,cut)-k<.6)continue;ctx.fillText(COL[layers[k]][1],0,BOT-mid-cy+1)}}
  ctx.restore()}
function drawTubeBody(x0,sealedGold){
  if(FIMG.complete)ctx.drawImage(FIMG,x0,0,TW,TH);
  if(sealedGold){const gl=ctx.createRadialGradient(x0+TW/2,TH*.5,4,x0+TW/2,TH*.5,TH*.6);gl.addColorStop(0,'rgba(255,214,120,.0)');gl.addColorStop(1,'rgba(255,214,120,.0)')}}
/* камень цвета зелья на ободке колбы: появляется, когда колба набрана одним цветом */
const capT={},GEMI=["gem-0.c5d3f8d5.webp", "gem-1.df281110.webp", "gem-2.bd3d74d5.webp", "gem-3.7c33a240.webp", "gem-4.164363f0.webp", "gem-5.b2415ba4.webp", "gem-6.fbe4c51e.webp", "gem-7.df7a0fa8.webp", "gem-8.83543fe9.webp", "gem-9.968e3439.webp"].map(n=>{const im=new Image();im.src='assets/game/'+n;return im});
function drawGem(ci,k){const im=GEMI[ci];if(!im||!im.complete)return;const D=20,cx=(ILx+IRx)/2-.3,cy=16.2,e=k>=1?1:1-Math.pow(1-k,3),sc=.4+.6*e;
  ctx.save();ctx.globalAlpha=Math.min(1,k*3);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=3;ctx.shadowOffsetY=1;ctx.drawImage(im,cx-D*sc/2,cy-D*sc/2,D*sc,D*sc);ctx.restore()}
function drawAura(x0,y){const gl=ctx.createRadialGradient(x0+TW/2,y+TH*.5,6,x0+TW/2,y+TH*.5,TH*.62);gl.addColorStop(0,'rgba(245,185,66,.30)');gl.addColorStop(1,'rgba(245,185,66,0)');ctx.fillStyle=gl;ctx.fillRect(x0-40,y-10,TW+80,TH+20)}
const pvx=cw=>cw?IRx+1:ILx-1;
function drawTube(i,P,t){
  const p=P[i],isA=anim&&anim.a===i,isB=anim&&anim.b===i;let layers=T[i],cut=layers.length,theta=0,amp=1.3;
  if(isB){layers=T[i].concat(Array(anim.n).fill(anim.c));cut=T[i].length+anim.n*anim.p;amp=1.3+2.4*Math.sin(Math.PI*Math.min(1,anim.p))}
  if(isA){cut=T[i].length-anim.n*anim.p}
  ctx.save();
  if(isA){const A=anim.pose;ctx.translate(A.px,A.py);ctx.rotate(A.th);ctx.scale(TSC,TSC);theta=A.th;const x0=-pvx(anim.cw),y0=-ITy;ctx.translate(0,y0);
    drawLiquid(x0,layers,cut,theta,amp,t);drawTubeBody(x0,false)}
  else{const lift=(sel===i&&!anim?-14:0)+hopOf(i,performance.now());ctx.translate(p.x,p.y+lift);ctx.scale(TSC,TSC);
    if(sel===i&&!anim){ctx.shadowColor='#f5b942';ctx.shadowBlur=16}
    drawLiquid(0,layers,cut,0,amp,t);drawTubeBody(0,sealed[i]&&full(T[i]));
    if(!isA&&!isB&&full(T[i])){if(capT[i]==null)capT[i]=performance.now();drawGem(T[i][0],Math.min(1,(performance.now()-capT[i])/380))}else delete capT[i]}
  ctx.restore()}
function drawStream(P){if(!anim||!anim.stream)return;const {px,py}=anim.pose,pb=P[anim.b],sy=pb.y+(BOT-(T[anim.b].length+anim.n*anim.p)*U)*TSC;
  const w=Math.max(2,6*anim.stream),cxb=pb.x+(ILx+IRx)/2*TSC,x=anim.cw?cxb-5:cxb+5,lx=anim.cw?px-2:px+2;
  const col=COL[anim.c][0];ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(lx-w/2,py);ctx.quadraticCurveTo(lx+(x-lx)*.15,py+(sy-py)*.5,x-w/2,sy);ctx.lineTo(x+w/2,sy);ctx.quadraticCurveTo(lx+(x-lx)*.15+w,py+(sy-py)*.5,lx+w/2,py);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect((lx+x)/2-1,py+4,1.6,Math.max(0,sy-py-8));
  // брызги
  ctx.fillStyle=col;for(let k=0;k<4;k++){const a=k*1.7+performance.now()*.01;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(x+Math.cos(a)*9,sy-3-Math.abs(Math.sin(a))*7,1.8,0,7);ctx.fill()}ctx.globalAlpha=1}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function hopOf(i,t){if(!winAt)return 0;const k=t-winAt-i*70;if(k<0||k>540)return 0;return -Math.abs(Math.sin(k/540*Math.PI))*17}
function spark(x,y,vx,vy,col,sz,life,star){parts.push({x,y,vx,vy,col,sz,life,age:0,star,rot:Math.random()*6})}
function winFx(){winAt=performance.now();const P=layout();
  P.forEach((p,i)=>{if(!full(T[i]))return;const cx=p.x+TW*TSC/2,cy=p.y+ITy*TSC;
    for(let k=0;k<16;k++){const a=-Math.PI/2+(Math.random()-.5)*1.7,s=70+Math.random()*150;spark(cx,cy,Math.cos(a)*s,Math.sin(a)*s,k%3?'#ffd978':COL[T[i][0]][0],2+Math.random()*3,.9+Math.random()*.7,k%2)}});
  for(let k=0;k<46;k++)spark(Math.random()*LW,-10-Math.random()*40,(Math.random()-.5)*50,40+Math.random()*90,COL[Math.floor(Math.random()*COL.length)][0],3+Math.random()*3,1.8+Math.random()*.8,0)}
function flyIcon(sel,toEl,delay){const src=document.querySelector(sel);if(!src)return;const bb=$('boardbox').getBoundingClientRect(),to=toEl.getBoundingClientRect();
  const el=document.createElement('img');el.src=src.src;el.alt='';el.style.cssText='position:fixed;z-index:9;width:46px;height:46px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 14px #f5b942);left:'+(bb.left+bb.width/2-23)+'px;top:'+(bb.top+bb.height/2-23)+'px;opacity:0';document.body.appendChild(el);
  const tx=to.left+30-(bb.left+bb.width/2),ty=to.top+to.height/2-(bb.top+bb.height/2);
  const an=el.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.5)',opacity:1,offset:.25},{transform:'scale(1.25)',opacity:1,offset:.5},{transform:'translate('+tx+'px,'+ty+'px) scale(.42)',opacity:.95}],{duration:1250,delay,easing:'ease-in-out',fill:'forwards'});
  an.onfinish=()=>{el.remove();toEl.animate([{transform:'scale(1)'},{transform:'scale(1.09)',boxShadow:'0 0 18px #f5b942'},{transform:'scale(1)'}],340);render()}}
function step(t){
  const P=layout();const d=+cv.dataset.d||1;
  ctx.setTransform(d*scale,0,0,d*scale,0,0);ctx.clearRect(0,0,LW,LH+20);
  // подставки
  P.forEach(p=>{ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(p.x+TW*TSC/2,p.y+TH*TSC-4,TW*TSC/2+4,5,0,0,7);ctx.fill()});
  if(anim){const k=t-anim.t0,A=anim,d1=230,d2=260,d3=300+A.n*170,d4=300,pa=P[A.a],pb=P[A.b];
    const rest={x:pa.x+pvx(A.cw)*TSC,y:pa.y+ITy*TSC},hov={x:pb.x+((ILx+IRx)/2+(A.cw?-10:10))*TSC,y:pb.y+ITy*TSC-44},TH_=A.cw?1.12:-1.12;A.stream=0;
    let m=0,th=0;
    if(k<d1){m=ease(k/d1)}else if(k<d1+d2){m=1;th=TH_*ease((k-d1)/d2)}
    else if(k<d1+d2+d3){m=1;th=TH_;A.p=Math.min(1,(k-d1-d2)/d3);A.stream=Math.min(1,(k-d1-d2)/90)*(A.p>.93?(1-A.p)/.07:1)}
    else if(k<d1+d2+d3+d4){A.p=1;const q=ease((k-d1-d2-d3)/d4);m=1-q;th=TH_*(1-q)}
    else{finish();requestAnimationFrame(step);return}
    A.pose={px:rest.x+(hov.x-rest.x)*m,py:rest.y+(hov.y-rest.y)*m-(1-Math.abs(1-2*m))*0,th};
    if(A.p==null)A.p=0}
  P.forEach((_,i)=>{if(!(anim&&anim.a===i))drawTube(i,P,t)});
  if(anim){drawTube(anim.a,P,t);drawStream(P)}
  if(winAt){const k=performance.now()-winAt;if(k<1500){const al=Math.max(0,1-k/1500),gr=ctx.createRadialGradient(LW/2,LH/2,10,LW/2,LH/2,80+k*.3);gr.addColorStop(0,'rgba(255,214,120,'+(al*.38)+')');gr.addColorStop(1,'rgba(255,214,120,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,LW,LH+20)}}
  const dt=Math.min(.05,(t-(lastT||t))/1000);lastT=t;
  parts=parts.filter(p=>p.age<p.life);
  parts.forEach(p=>{p.age+=dt;p.vy+=(p.star?260:120)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*4;const a=Math.min(1,(p.life-p.age)*1.6);ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.star){ctx.beginPath();ctx.moveTo(0,-p.sz*1.8);ctx.lineTo(p.sz*.5,0);ctx.lineTo(0,p.sz*1.8);ctx.lineTo(-p.sz*.5,0);ctx.closePath();ctx.fill();ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,-p.sz*1.8);ctx.lineTo(p.sz*.5,0);ctx.lineTo(0,p.sz*1.8);ctx.lineTo(-p.sz*.5,0);ctx.closePath();ctx.fill()}
    else ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*1.5);ctx.restore()});ctx.globalAlpha=1;
  requestAnimationFrame(step)}
/* ---------- логика ---------- */
function canPour(a,b){const A=T[a],B=T[b];if(a===b||!A.length||B.length>=CAP)return 0;const top=A[A.length-1];if(B.length&&B[B.length-1]!==top)return 0;if(!B.length&&A.every(v=>v===top))return 0;let n=0;while(n<A.length&&A[A.length-1-n]===top&&B.length+n<CAP)n++;return n}
function finish(){moves++;const {a,b,n,c}=anim;hist.push(JSON.stringify(T));T[a]=T[a].slice(0,T[a].length-n);T[b]=T[b].concat(Array(n).fill(c));anim=null;sealed={};T.forEach((t,i)=>{if(full(t))sealed[i]=1});render();check()}
function tap(i){if(won||anim)return;
  if(sel===null){if(T[i].length)sel=i;render();return}
  if(sel===i){sel=null;render();return}
  const n=canPour(sel,i);
  if(!n){sel=T[i].length?i:null;render();return}
  const P=layout();anim={a:sel,b:i,n,c:T[sel][T[sel].length-1],cw:P[sel].x<=P[i].x,t0:performance.now(),p:0,stream:0,pose:{px:0,py:0,th:0}};sel=null;render()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;
  const P=layout();for(let i=0;i<P.length;i++){const p=P[i];if(x>=p.x-8&&x<=p.x+TW*TSC+8&&y>=p.y-24&&y<=p.y+TH*TSC+10){tap(i);return}}});
function start(i,reward=true){for(const k in capT)delete capT[k];winAt=0;parts=[];li=i;moves=0;rew=!!reward&&!done[i]&&ready;
  seed=rew?((DS*2654435761+mode*977+i*131)>>>0):Math.floor(Math.random()*4e9);
  T=gen(LVc()[i]);hist=[];sel=null;anim=null;extraUsed=false;won=false;sealed={};$('winbox').innerHTML='';fit();render();
  if(rew)call('start',{m:mode,l:i}).then(applyG).catch(()=>{rew=false;toast(s('offline'))})}
function applyG(g){if(!g)return;DS=+String(g.day).replace(/-/g,'')||DS;dn[0]=g.normal.slice();dn[1]=g.expert.slice();gem=g.gem?1:0;heat=dn[0].filter(Boolean).length;render()}
function render(){fit2();
  $('lv').innerHTML=LVc().map((l,i)=>'<button class="lvb'+(i===li?' cur':'')+(done[i]?' done':'')+'" data-l="'+i+'"'+''+'>'+(done[i]?'✓ ':'')+s('lv'+i)+'</button>').join('');
  document.querySelectorAll('.lvb[data-l]').forEach(b=>b.onclick=()=>{if(!anim)start(+b.dataset.l,true)});
  $('ht').textContent=heat+' '+s('of3');$('gm').textContent=gem?s('got'):dn[1].filter(Boolean).length+' '+s('of3');document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('cur',+b.dataset.m===mode));$('chH').classList.toggle('dim',mode===1);$('chG').classList.toggle('dim',mode===0);$('pips').innerHTML=[0,1,2].map(i=>'<div class="pip'+(i<heat?' on':'')+'"></div>').join('');$('pips2').innerHTML=[0,1,2].map(i=>'<div class="pip'+(i<dn[1].filter(Boolean).length?' on':'')+'"></div>').join('');
  $('undo').disabled=!hist.length||!!anim;$('extra').hidden=!(li===2&&mode===0);$('extra').disabled=extraUsed||!!anim}
function fit2(){layout();fit()}
function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1900)}
function showWin(msg,isNew){const next=li<2;
  $('winbox').innerHTML='<div class="win"><b>'+msg+'</b>'+(isNew?'':'<span class="sub">'+s('already')+'</span>')+'<button class="btn gold" id="nx" style="flex:none;width:auto;padding:10px 18px">'+(next?s('next'):s('more'))+'</button></div>';
  $('nx').onclick=()=>start(next?li+1:li,true);render()}
function check(){if(won)return;if(!T.every(x=>x.length===0||full(x)))return;won=true;winFx();
  if(!rew){setTimeout(()=>showWin(s('sorted'),false),1700);return}
  const t0=Date.now(),m=mode,l=li;
  call('finish',{m,l,mv:moves}).then(r=>{
    const gh=r.heat,gg=r.gems;rew=false;applyG(r.game);parent.postMessage({lcgame:1,cmd:'pet',pet:r.pet},location.origin);
    const msg=m===0?s('done_')+HI:(gg?s('expDone'):s('stage'));
    if(gh)flyIcon('#chH img',$('chH'),500);if(gg)flyIcon('#chG img',$('chG'),500);
    setTimeout(()=>{showWin(msg,true);if(gh)toast(s('tHeat'));if(gg)toast(s('tGem'))},Math.max(0,1700-(Date.now()-t0)))
  }).catch(e=>{rew=false;const em=String(e&&e.message||'');
    const msg=em.indexOf('game_too_fast')>=0?s('fast'):em.indexOf('no_start')>=0?s('nostart'):s('offline');
    setTimeout(()=>{showWin(s('sorted'),true);toast(msg)},Math.max(0,1700-(Date.now()-t0)))})}
$('undo').onclick=()=>{if(!hist.length||won||anim)return;T=JSON.parse(hist.pop());sel=null;sealed={};T.forEach((t,i)=>{if(full(t))sealed[i]=1});render()};
$('restart').onclick=()=>{if(!anim)start(li,true)};
$('extra').onclick=()=>{if(extraUsed||won||anim)return;hist.push(JSON.stringify(T));T.push([]);extraUsed=true;render()};
$('glyph').onclick=e=>{glyphs=!glyphs;e.currentTarget.setAttribute('aria-pressed',glyphs);};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{if(anim)return;mode=+b.dataset.m;start(0,true)});
window.addEventListener('resize',()=>{fit()});$('qb').onclick=()=>$('sheet').classList.add('open');$('qc').onclick=()=>$('sheet').classList.remove('open');
$('xb').onclick=()=>parent.postMessage({lcgame:1,cmd:'close'},location.origin);
addEventListener('keydown',e=>{if(e.key==='Escape')$('xb').click()});
let seen=false;try{seen=localStorage.getItem('lcgame_seen')==='1'}catch(e){}
if(!seen){$('sheet').classList.add('open');try{localStorage.setItem('lcgame_seen','1')}catch(e){}}
start(0,false);requestAnimationFrame(step);
call('get').then(g=>{ready=true;applyG(g);if(!anim&&!won&&!hist.length)start(0,true)}).catch(()=>{ready=false;toast(s('load'))});
</script>
</body></html>
